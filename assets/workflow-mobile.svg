<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img" aria-labelledby="title desc">
<title id="title">Idea. Build. Ship.</title><desc id="desc">A vertical development process for narrow screens, with one decorative pulse. This is not a live project status.</desc>
<style>
.pulse{animation:travel 7s cubic-bezier(.16,1,.3,1) infinite;transform:translateY(0)}
@keyframes travel{0%,12%{transform:translateY(0);opacity:0}16%{opacity:1}48%{transform:translateY(78px);opacity:1}82%{transform:translateY(156px);opacity:1}92%,100%{transform:translateY(156px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
</style>
<rect width="420" height="258" rx="8" fill="#101b28"/>
<path d="M38 46V202" stroke="#385565" stroke-width="2"/>
<g fill="#101b28" stroke="#82cecb" stroke-width="2"><circle cx="38" cy="46" r="6"/><circle cx="38" cy="124" r="6"/><circle cx="38" cy="202" r="6"/></g>
<g fill="#f4eee2" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600"><text x="68" y="48">idea</text><text x="68" y="126">build</text><text x="68" y="204">ship</text></g>
<g fill="#a2bdc8" font-family="Arial,Helvetica,sans-serif" font-size="19"><text x="68" y="74">find the friction</text><text x="68" y="152">make it useful</text><text x="68" y="230">leave a recovery path</text></g>
<circle class="pulse" cx="38" cy="46" r="5" fill="#efbb76"/>
</svg>