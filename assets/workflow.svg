<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 118" width="1000" height="118" role="img" aria-labelledby="title desc">
<title id="title">Idea. Build. Ship.</title><desc id="desc">A decorative animated line connecting idea, build, and ship. This illustrates a development approach and does not show live project status.</desc>
<style>
.pulse{animation:travel 7s cubic-bezier(.16,1,.3,1) infinite;transform:translateX(0)}
@keyframes travel{0%,12%{transform:translateX(0);opacity:0}16%{opacity:1}48%{transform:translateX(320px);opacity:1}82%{transform:translateX(640px);opacity:1}92%,100%{transform:translateX(640px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
</style>
<rect width="1000" height="118" rx="8" fill="#101b28"/>
<path d="M180 58H820" stroke="#385565" stroke-width="2"/>
<g fill="#101b28" stroke="#82cecb" stroke-width="2"><circle cx="180" cy="58" r="6"/><circle cx="500" cy="58" r="6"/><circle cx="820" cy="58" r="6"/></g>
<g fill="#f4eee2" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle"><text x="180" y="37">idea</text><text x="500" y="37">build</text><text x="820" y="37">ship</text></g>
<g fill="#a2bdc8" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle"><text x="180" y="92">find the friction</text><text x="500" y="92">make it useful</text><text x="820" y="92">leave a recovery path</text></g>
<circle class="pulse" cx="180" cy="58" r="5" fill="#efbb76"/>
</svg>